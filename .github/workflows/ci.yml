name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  servidor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: delonix, POSTGRES_PASSWORD: delonix_dev, POSTGRES_DB: delonix_push }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delonix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://delonix:delonix_dev@localhost:5432/delonix_push
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  sdk-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Testes do :core (servidor de papel) e compilação do :android
        working-directory: sdk/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          ./gradlew --no-daemon :core:test :android:assembleDebug
